name: PR body

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate pull request body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-pr-body.mjs
